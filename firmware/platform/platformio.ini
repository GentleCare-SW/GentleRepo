; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = glide_v1

; ---------------------------------------------------------------------------
; Shared configuration for every device variant. Each [env:*] section below
; extends this and adds a single -D VARIANT_* flag to select the build.
; Build a specific variant with e.g. `pio run -e glide_v1 -t upload`.
;
; The legacy -D PLATFORM_TYPE / -D SOFTWARE_VERSION flags are still emitted so
; the existing config.h / main.cpp keep building unchanged; they will be
; removed once those files are migrated to the VARIANT_* flags.
; ---------------------------------------------------------------------------
[platform_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-I ../
	-D BAUD_RATE=115200
lib_deps =
	h2zero/NimBLE-Arduino@^2.3.6
	adafruit/Adafruit SSD1306@^2.5.15
	adafruit/Adafruit MPRLS Library@^1.2.2
	sparkfun/SparkFun LPS28DFW Arduino Library@^1.0.0

; GentleWedge M0
[env:wedge_v0]
extends = platform_base
build_flags =
	${platform_base.build_flags}
	-D WEDGE_V0
	-D SHEET_W0
	-D MOTOR_TYPE_81
	-D PLATFORM_TYPE=0
	-D SOFTWARE_VERSION=1

; GentleWedge M1
[env:wedge_v1]
extends = platform_base
build_flags =
	${platform_base.build_flags}
	-D WEDGE_V1
	-D SHEET_W0
	-D PLATFORM_TYPE=0
	-D SOFTWARE_VERSION=1

; GentleGlide M0
[env:glide_v0]
extends = platform_base
build_flags =
	${platform_base.build_flags}
	-D GLIDE_V0
	-D SHEET_G0
	-D MOTOR_TYPE_81
	-D PLATFORM_TYPE=1
	-D SOFTWARE_VERSION=0

; GentleGlide M1
[env:glide_v1]
extends = platform_base
build_flags =
	${platform_base.build_flags}
	-D GLIDE_V1
	-D SHEET_G1
	-D MOTOR_TYPE_53
	-D PLATFORM_TYPE=1
	-D SOFTWARE_VERSION=0

; GentleGlide M2
[env:glide_v2]
extends = platform_base
build_flags =
	${platform_base.build_flags}
	-D GLIDE_V2
	-D SHEET_G2
	-D PLATFORM_TYPE=1
	-D SOFTWARE_VERSION=1

